# Production stack for one server. Driven by deploy/deploy.sh (local) → deploy/remote.sh (server).
#
# Layout on the server:  ~/querion/app     code, replaced on every deploy
#                        ~/querion/shared  .env (created once), demo-site/config.js, backups
# Data lives ONLY in the named volumes below. Nothing in this file may delete them:
# never run `docker compose down -v`.
name: querion

x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  MINIO_BUCKET: querion-docs
  MINIO_USE_SSL: "false"

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../infra/docker/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: quay.io/minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:  # creates the bucket if missing; never deletes anything
    image: quay.io/minio/mc
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/querion-docs"

  api:
    build: ../apps/api
    image: querion/api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app-env
      DEBUG: "false"
      WEB_PUBLIC_URL: https://${PUBLIC_DOMAIN}
      CORS_ORIGINS: https://${PUBLIC_DOMAIN}
      # demo website on its own origin, so the embed allow-list is exercised for real
      DEMO_SITE_ORIGIN: https://demo.${PUBLIC_DOMAIN}
      DEMO_SITE_DIR: /shared/demo-site
      # synthetic systems called by the demo tools (compose service names)
      DEMO_CORE_URL: http://mock-core:8095
      DEMO_MCP_URL: http://mock-mcp:8096/mcp
      DEMO_DWH_URL: http://mock-dwh:8097/mcp
      TOOL_INTERNAL_ALLOWLIST: mock-core:8095,mock-mcp:8096,mock-dwh:8097
    volumes:
      - ../../shared/demo-site:/shared/demo-site
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # Report / form jobs. Same image as the API on purpose: a report needs the workflow runtime,
  # the tool registry, MinIO and token metering, none of which the indexing worker has.
  jobs-worker:
    image: querion/api:latest
    pull_policy: never
    command: ["python", "-m", "app.jobs.worker"]
    restart: unless-stopped
    healthcheck:
      disable: true   # not an HTTP service; the container is the worker, Docker restarts it if it dies
    env_file: .env
    environment:
      <<: *app-env
      DEBUG: "false"
      WEB_PUBLIC_URL: https://${PUBLIC_DOMAIN}
      DEMO_CORE_URL: http://mock-core:8095
      DEMO_MCP_URL: http://mock-mcp:8096/mcp
      DEMO_DWH_URL: http://mock-dwh:8097/mcp
      TOOL_INTERNAL_ALLOWLIST: mock-core:8095,mock-mcp:8096,mock-dwh:8097
    depends_on:
      api:
        condition: service_healthy

  # Cron ticker for report schedules + cleanup of expired report files.
  scheduler:
    image: querion/api:latest
    pull_policy: never
    command: ["python", "-m", "app.scheduler"]
    restart: unless-stopped
    healthcheck:
      # the ticker refreshes this Redis key every tick; a stale key means schedules stopped firing
      test: ["CMD", "python", "-c", "import os,sys,redis; sys.exit(0 if redis.from_url(os.environ['REDIS_URL']).get('scheduler:heartbeat') else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    env_file: .env
    environment:
      <<: *app-env
      DEBUG: "false"
      SCHEDULER_TICK_SECONDS: "30"
    depends_on:
      api:
        condition: service_healthy

  worker:
    build: ../apps/worker
    image: querion/worker:latest
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app-env
      WORKER_LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  web:
    build:
      context: ../apps/web
      args:
        NEXT_PUBLIC_API_URL: https://${PUBLIC_DOMAIN}
        NEXT_PUBLIC_BRAND_NAME: ${BRAND_NAME:-MSB Knowledge Assistant}
    image: querion/web:latest
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000   # server-side calls from the Next proxy (embed CSP)
    depends_on:
      - api

  mock-core:  # synthetic core-banking API (demo data only)
    image: querion/api:latest
    pull_policy: never
    restart: unless-stopped
    command: ["uvicorn", "core_api:app", "--app-dir", "/demo-mock", "--host", "0.0.0.0", "--port", "8095"]
    volumes:
      - ../demo-mock:/demo-mock:ro
    healthcheck:
      disable: true

  mock-dwh:  # synthetic reporting warehouse, MCP (demo data only)
    image: querion/api:latest
    pull_policy: never
    restart: unless-stopped
    command: ["python", "/demo-mock/dwh_mcp.py"]
    environment:
      MCP_HOST: 0.0.0.0
      PORT: "8097"
    volumes:
      - ../demo-mock:/demo-mock:ro
    healthcheck:
      disable: true

  mock-mcp:  # synthetic MCP server (demo data only)
    image: querion/api:latest
    pull_policy: never
    restart: unless-stopped
    command: ["python", "/demo-mock/mcp_server.py"]
    environment:
      MCP_HOST: 0.0.0.0
      PORT: "8096"
    volumes:
      - ../demo-mock:/demo-mock:ro
    healthcheck:
      disable: true

  caddy:  # the only service with published ports; issues HTTPS certificates automatically
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../demo-site:/srv/demo-site:ro
      - ../../shared/demo-site:/shared/demo-site:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:    # certificates: keep, or Let's Encrypt rate limits bite on redeploy
  caddy_config:
