<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="MSB Knowledge Assistant">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f28a2e"/>
      <stop offset="1" stop-color="#e2571a"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- rounded tile, MSB orange -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="60" rx="30" fill="url(#shine)"/>
  <!-- speech bubble with tail -->
  <path d="M34 30h60a14 14 0 0 1 14 14v34a14 14 0 0 1-14 14H58l-18 15c-3 2.5-7.5.4-7.5-3.5V92h1.5A14 14 0 0 1 20 78V44a14 14 0 0 1 14-14z" fill="#fff"/>
  <!-- shield with check: the staff assistant mark, inside the bubble -->
  <path d="M64 41l17 6.2v12c0 10-6.9 18.6-17 22.8-10.1-4.2-17-12.8-17-22.8v-12L64 41z" fill="#e2571a"/>
  <path d="M55.5 61l6 6 11.5-12" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
